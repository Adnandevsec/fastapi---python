name: DevSecOps Comprehensive Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  sast-code-scan:
    name: SAST Code Security Scan (Bandit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Bandit SAST Tool
        run: pip install bandit

      - name: Run Bandit Scan on Python Code
        run: bandit -r ./app -ll --format json --output bandit-report.json || true

  container-and-vuln-scan:
    name: Docker Build & Trivy Vulnerability Scan
    runs-on: ubuntu-latest
    needs: sast-code-scan 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build Docker Image
        run: docker build -t fastapi-secure-app:latest .

      - name: Run Trivy Vulnerability Scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'fastapi-secure-app:latest'
          format: 'table'
          exit-code: '1'
          ignore-unfixed: true
          severity: 'CRITICAL,HIGH'