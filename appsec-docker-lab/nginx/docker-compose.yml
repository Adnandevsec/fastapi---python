version: '3.8'

services:
  fastapi-app:
    build: .
    container_name: fastapi_secure_app
    restart: always

    expose:
      - "8000"

  nginx-proxy:
    image: nginx:alpine
    container_name: nginx_secure_proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - fastapi-app